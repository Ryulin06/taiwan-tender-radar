name: 同步標案資料

on:
  workflow_dispatch:
    inputs:
      backfill_months:
        description: "本次回補幾個歷史月份"
        required: false
        default: "1"

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: tender-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Sync tender data
        env:
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_months || '1' }}
        run: npm run sync

      - name: Commit updated data
        run: |
          if git diff --quiet; then
            echo "沒有新資料，不需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tenders.json data/sync-status.json
          git commit -m "自動更新標案資料"
          git push

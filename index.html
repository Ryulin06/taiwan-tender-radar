<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10253e">
  <meta name="description" content="台灣行銷、媒體、社群、影片與宣傳標案搜尋平台">
  <title>台灣標案雷達</title>
  <style>
    :root{--navy:#10243b;--navy2:#1c4f86;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--line:#dfe6ef;--muted:#68758a;--text:#172033;--soft:#eef4ff;--shadow:0 12px 32px rgba(28,46,74,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 22px 78px}.wrap{max-width:1200px;margin:auto}.brand{font-size:22px;font-weight:850;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#ffffff1f;border:1px solid #ffffff30;display:grid;place-items:center}.hero{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-top:28px}h1{font-size:36px;margin:0 0 9px}.hero p{margin:0;color:#d8e6f5;line-height:1.65}.status{background:#ffffff1f;border:1px solid #ffffff25;padding:12px 15px;border-radius:12px;font-size:13px;line-height:1.55;max-width:420px}.main{margin-top:-48px;padding:0 18px 64px}.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}.filters{padding:20px;display:grid;grid-template-columns:1.7fr repeat(4,.78fr);gap:11px}.field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:7px}input,select{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);padding:0 12px;background:#fff}.actions{display:flex;gap:10px;padding:0 20px 18px;flex-wrap:wrap}.actions button,.actions a{height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;color:var(--text)}.actions .primary{background:var(--blue);color:#fff;border-color:var(--blue)}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 20px}.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid #cfd8e6;background:#fff;color:#526071;font-size:13px;font-weight:750}.chip.on{background:var(--soft);color:var(--blue);border-color:#abc3ff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border-radius:15px;padding:17px 18px;box-shadow:0 4px 14px #1c2e4a0c;color:var(--muted);font-size:13px}.stat b{display:inline-block;color:var(--text);font-size:25px;margin-top:6px}.tablehead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th{background:#f8fafc;text-align:left;padding:12px 15px;font-size:12px;color:#667085}td{padding:15px;border-top:1px solid #edf1f6;font-size:14px;vertical-align:top;line-height:1.55}.title{font-weight:780}.tag{display:inline-block;background:var(--soft);color:#315cbb;border-radius:6px;padding:3px 7px;font-size:11px;margin:6px 4px 0 0}.money{font-weight:800}.pending{color:#8a6070}.empty{text-align:center;padding:52px;color:var(--muted)}.note{font-size:12px;color:var(--muted);padding:0 20px 18px}
    @media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.hero{display:block}.status{display:inline-block;margin-top:15px}.summary{grid-template-columns:1fr 1fr}}
    @media(max-width:680px){header{padding:22px 16px 64px}h1{font-size:28px}.main{padding:0 10px 48px;margin-top:-38px}.filters{grid-template-columns:1fr 1fr;padding:15px}.actions{display:grid;grid-template-columns:1fr 1fr;padding:0 15px 15px}.actions button,.actions a{justify-content:center;padding:0 8px}.chips{padding:0 15px 17px}.summary{gap:9px;margin:13px 0}.stat{padding:14px 13px}.stat b{font-size:21px}.tablehead{padding:15px;flex-direction:column;align-items:flex-start;gap:4px}.scroll{overflow:visible}table{min-width:0;display:block;padding:10px}thead{display:none}tbody,tr,td{display:block;width:100%}tr{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:11px;padding:13px 14px}td{border:0;padding:8px 0 8px 112px;position:relative}td:first-child{padding:0 0 12px;border-bottom:1px solid #edf1f6;margin-bottom:5px}td:first-child:before{display:none}td:before{content:attr(data-label);position:absolute;left:0;top:8px;width:100px;color:var(--muted);font-size:12px;font-weight:750}.title{font-size:16px}}
  </style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div class="logo">⌕</div><span>台灣標案雷達</span></div><div class="hero"><div><h1>行銷與媒體標案即時搜尋</h1><p>GitHub Actions 每 3 小時同步，網站支援手機瀏覽與 Excel 匯出。</p></div><div class="status" id="status">讀取更新狀態中…</div></div></div></header>
<main class="wrap main">
<section class="card"><div class="filters">
<div class="field search"><label>搜尋案名、機關、案號或廠商</label><input id="q" placeholder="例如：基隆、影片、環保政策"></div>
<div class="field"><label>年份</label><select id="year"><option value="">全部</option></select></div>
<div class="field"><label>月份</label><select id="month"><option value="">全部</option></select></div>
<div class="field"><label>日期</label><select id="day"><option value="">全部</option></select></div>
<div class="field"><label>縣市</label><select id="city"><option>全部縣市</option></select></div>
</div><div class="actions"><button class="primary" id="searchBtn">搜尋標案</button><a id="actionLink" target="_blank" rel="noopener">執行資料同步</a><button id="exportBtn">匯出 Excel</button><button id="resetBtn">重設條件</button></div><div class="chips" id="chips"></div><div class="note">「執行資料同步」會開啟 GitHub Actions 頁面，請按 Run workflow。網站每 10 秒檢查已發布的 JSON；Actions 完成並重新發布 Pages 後，資料才會更新。</div></section>
<section class="summary"><div class="stat">符合件數<br><b id="count">0</b> 件</div><div class="stat">預算總額<br><b id="budget">0</b> 萬</div><div class="stat">未公告廠商<br><b id="pending">0</b> 件</div><div class="stat">涵蓋縣市<br><b id="citiesCount">0</b> 個</div></section>
<section class="card"><div class="tablehead"><b>標案列表（上標日由舊到新）</b><span id="result"></span></div><div class="scroll"><table><thead><tr><th>案名</th><th>上標日</th><th>投標截止日</th><th>預算金額</th><th>上標單位</th><th>得標廠商</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main>
<script>
const KEYWORDS=['數位','媒體','社群','影片','拍攝','FB','推廣','宣傳','活動案','行銷','計畫'];
const CITIES=['基隆市','臺北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣','中央／其他'];
const $=id=>document.getElementById(id);let all=[],filtered=[],active=new Set(KEYWORDS);
function setup(){for(let y=new Date().getFullYear();y>=2024;y--)$('year').add(new Option(y+' 年',y));for(let m=1;m<=12;m++)$('month').add(new Option(m+' 月',m));for(let d=1;d<=31;d++)$('day').add(new Option(d+' 日',d));CITIES.forEach(c=>$('city').add(new Option(c,c)));KEYWORDS.forEach(k=>{const b=document.createElement('button');b.className='chip on';b.textContent=k;b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('on');render()};$('chips').appendChild(b)});$('searchBtn').onclick=render;$('exportBtn').onclick=exportExcel;$('resetBtn').onclick=reset;$('q').oninput=render;['year','month','day','city'].forEach(id=>$(id).onchange=render);const repo=`${location.hostname.split('.')[0]}/${location.pathname.split('/').filter(Boolean)[0]||''}`;$('actionLink').href=`https://github.com/${repo}/actions/workflows/sync-tenders.yml`;load();setInterval(load,10000)}
async function load(){try{const [data,status]=await Promise.all([fetch(`./data/tenders.json?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()),fetch(`./data/sync-status.json?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())]);all=Array.isArray(data)?data:[];const b=status.backfill||{};$('status').textContent=status.finished_at?`最後更新：${format(status.finished_at)}｜${status.status}｜共 ${status.count||all.length} 筆｜歷史回補 ${b.completed_months||0} 月${b.done?'（完成）':''}`:`尚未同步｜目前 ${all.length} 筆`;render()}catch(e){$('status').textContent='資料讀取失敗，請確認 GitHub Pages 已發布 data 資料夾'}}
function render(){const q=$('q').value.trim().toLowerCase(),y=$('year').value,m=String($('month').value||'').padStart(2,'0'),d=String($('day').value||'').padStart(2,'0'),city=$('city').value;filtered=all.filter(x=>{const date=x.publish_date||'',text=`${x.title||''} ${x.agency||''} ${x.case_no||''} ${x.winner||''}`.toLowerCase();return(!y||date.slice(0,4)===y)&&(!$('month').value||date.slice(5,7)===m)&&(!$('day').value||date.slice(8,10)===d)&&(city==='全部縣市'||x.city===city)&&(!q||text.includes(q))&&(!active.size||[...active].some(k=>text.includes(k.toLowerCase())))}).sort((a,b)=>(a.publish_date||'').localeCompare(b.publish_date||'')||String(a.title).localeCompare(String(b.title),'zh-Hant'));$('body').innerHTML=filtered.length?filtered.map(x=>`<tr><td data-label="案名"><div class="title">${esc(x.title)}</div><span class="tag">${esc(x.case_no||'無案號')}</span><span class="tag">${esc(x.city||'中央／其他')}</span></td><td data-label="上標日">${x.publish_date||'未提供'}</td><td data-label="投標截止日">${x.deadline||'未提供'}</td><td data-label="預算金額" class="money">${x.budget==null?'未公告':'NT$ '+Number(x.budget).toLocaleString()}</td><td data-label="上標單位">${esc(x.agency||'未提供')}</td><td data-label="得標廠商" class="${x.winner==='未公告'?'pending':''}">${esc(x.winner||'未公告')}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">目前沒有符合條件的標案</td></tr>`;$('count').textContent=filtered.length;$('budget').textContent=Math.round(filtered.reduce((a,x)=>a+(x.budget||0),0)/10000).toLocaleString();$('pending').textContent=filtered.filter(x=>!x.winner||x.winner==='未公告').length;$('citiesCount').textContent=new Set(filtered.map(x=>x.city)).size;$('result').textContent='共 '+filtered.length+' 筆'}
function exportExcel(){if(!filtered.length)return alert('目前沒有可匯出的資料');const rows=[['案名','上標日','投標截止日','預算金額','上標單位','得標廠商'],...filtered.map(x=>[x.title,x.publish_date||'',x.deadline||'',x.budget??'',x.agency||'',x.winner||'未公告'])];const html=`<html><head><meta charset="UTF-8"></head><body><table>${rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join('')}</table></body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`台灣標案報表_${new Date().toISOString().slice(0,10)}.xls`;a.click();URL.revokeObjectURL(a.href)}
function reset(){$('q').value='';$('year').value='';$('month').value='';$('day').value='';$('city').value='全部縣市';active=new Set(KEYWORDS);document.querySelectorAll('.chip').forEach(b=>b.classList.add('on'));render()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function format(s){try{return new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}catch{return s}}setup();
</script>
</body></html>
